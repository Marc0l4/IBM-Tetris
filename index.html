<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberPulse Tetris</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="top-bar">
    <span class="brand">Cyber<span>Pulse</span></span>
  </header>

  <main class="game-wrapper">

    <!-- PAINEL ESQUERDO -->
    <aside class="panel panel--left">
      <div class="stat-box">
        <span class="stat-label">PONTOS</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">NÍVEL</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">LINHAS</span>
        <span class="stat-value" id="lines">0</span>
      </div>
    </aside>

    <!-- CANVAS -->
    <div class="canvas-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay__box">
          <h2 id="overlay-title">CyberPulse<br/><span>TETRIS</span></h2>
          <p id="overlay-msg">Pressione <kbd>Enter</kbd> para começar</p>
          <div id="overlay-score" class="overlay-score"></div>
        </div>
      </div>
    </div>

    <!-- PAINEL DIREITO -->
    <aside class="panel panel--right">
      <div class="stat-box">
        <span class="stat-label">PRÓXIMA</span>
        <canvas id="next-canvas" width="100" height="100"></canvas>
      </div>
      <div class="controls-hint">
        <p><kbd>←</kbd><kbd>→</kbd> Mover</p>
        <p><kbd>↓</kbd> Descer</p>
        <p><kbd>Espaço</kbd> Girar</p>
        <p><kbd>Enter</kbd> Iniciar</p>
      </div>
    </aside>

  </main>

  <script src="app.js"></script>
</body>
</html>
